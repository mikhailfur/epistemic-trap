name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Validate corpus (all tests)
        run: python scripts/validate_corpus.py corpus/
      - name: Selfcheck (Test A)
        run: python -m epistemic_trap selfcheck
      - name: Selfcheck (Test B)
        run: python -m epistemic_trap selfcheck
        env:
          TRAP_TEST: test_b_nebula
