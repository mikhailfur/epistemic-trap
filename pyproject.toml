[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-trap"
version = "0.1.0"
description = "Red-team harness for LLM coding agents: fake-web MCP servers (web_search / web_fetch) probing tool-source credulity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mikhail Fur" }]
keywords = ["mcp", "llm", "ai-safety", "red-team", "benchmark", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "mcp>=1.9.0,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
epistemic-trap = "epistemic_trap.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
